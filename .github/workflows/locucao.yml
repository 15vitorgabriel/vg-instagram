# Gera só a locução de um reel (Gemini TTS) e guarda como artefato, para testar versões do vídeo com a mesma voz.
name: Locução de um reel

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Post (AAAA-MM-DD)"
        required: true

permissions:
  contents: read

jobs:
  locucao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar locução
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node locucao.mjs "${{ inputs.date }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ inputs.date }}
          path: out/${{ inputs.date }}/voz/
          retention-days: 7
