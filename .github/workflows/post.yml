# Post diário: renderiza os posts de hoje (posts/AAAA-MM-DD*.json), publica as imagens no GitHub Pages
# (a API do Instagram só aceita mídia em URL pública) e posta na ordem do sufixo -1, -2, -3.
name: Post do dia

on:
  schedule:
    # Posts saem no horário do campo "hora" (padrão 12); o job roda nos horários usados
    # Três tentativas por horário: o cron do GitHub atrasa ou pula sob carga; a primeira que rodar publica,
    # as outras entram na fila (concurrency) e não acham nada pendente
    - cron: "0,20,40 12 * * *" # 9h em Brasília
    - cron: "0,20,40 15 * * *" # 12h em Brasília
    - cron: "0,20,40 21 * * *" # 18h em Brasília
  workflow_dispatch:
    inputs:
      date:
        description: "Data (AAAA-MM-DD). Vazio = hoje"
        required: false
      check:
        description: "Só testar: monta o post no Instagram sem publicar"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency: post

jobs:
  post:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      # reel.mjs usa o WebSocket nativo do Node 22 para controlar o Chrome
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Posts pendentes de hoje
        id: ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="${{ inputs.date }}"; day="${day:-$(TZ=America/Sao_Paulo date +%F)}"
          # Veto: comentário "vetar DD/MM" do dono do repositório nos resumos semanais (issues "semana").
          # O repositório é público, então comentário de qualquer outra pessoa é ignorado.
          vetos=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=semana&state=all&per_page=10" --jq '.[].number' | while read -r n; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" --jq '.[] | select(.user.login == "${{ github.repository_owner }}") | .body'
          done | grep -oiE 'vet[a-z]*[[:space:]]+[0-9]{1,2}/[0-9]{1,2}' | grep -oE '[0-9]{1,2}/[0-9]{1,2}' | tr '\n' ' ')
          ids=$(node -e '
            const fs = require("fs"); const [day, vetos, manual] = process.argv.slice(1);
            const vetado = (id) => vetos.split(" ").some(v => { const [vd, vm] = v.split("/").map(Number); const [, m, d] = id.slice(0, 10).split("-").map(Number); return vd === d && vm === m; });
            const done = fs.existsSync("published.json") ? JSON.parse(fs.readFileSync("published.json")) : {};
            // Agendado: o do dia só depois da hora (campo "hora", padrão 12h); dias anteriores que ficaram para trás
            // (o cron do GitHub atrasa, às vezes horas) saem na hora. Disparo manual com data publica só aquele dia, inteiro.
            const hour = manual ? 24 : Number(new Date().toLocaleString("en-US", { timeZone: "America/Sao_Paulo", hour: "numeric", hour12: false }));
            const ids = fs.readdirSync("posts").map(f => f.slice(0, -5))
              .filter(id => manual ? id.startsWith(day) : id.slice(0, 10) <= day)
              .filter(id => !done[id] || done[id].partial).filter(id => !vetado(id))
              .filter(id => id.slice(0, 10) < day || (JSON.parse(fs.readFileSync(`posts/${id}.json`)).hora ?? 12) <= hour).sort();
            console.log(ids.join(" "));' "$day" "$vetos" "${{ inputs.date }}")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "dia $day: ${ids:-nada pendente}"

      - name: Renderizar
        if: steps.ids.outputs.ids != ''
        env:
          BROWSER: google-chrome
          # locução dos reels (opcional): sem a chave, o reel sai só com a trilha
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          for id in ${{ steps.ids.outputs.ids }}; do node render.mjs "$id"; done
          find out -name '*.html' -delete

      - uses: actions/upload-pages-artifact@v3
        if: steps.ids.outputs.ids != ''
        with:
          path: out

      # O deploy do Pages às vezes falha com "No artifacts named github-pages" logo depois do upload (instabilidade do
      # GitHub; em 23/11 isso atrasou o post das 12h para as 23h). Tenta até 3 vezes, com espera entre elas.
      # o GitHub às vezes ainda não lista o artefato 1 s depois do upload ("Found 0 artifact(s)")
      - name: Esperar o artefato ficar visível
        if: steps.ids.outputs.ids != ''
        run: sleep 20

      - uses: actions/deploy-pages@v4
        if: steps.ids.outputs.ids != ''
        id: pages
        continue-on-error: true

      - name: Esperar para tentar o deploy de novo
        if: steps.ids.outputs.ids != '' && steps.pages.outcome == 'failure'
        run: sleep 45

      - uses: actions/deploy-pages@v4
        if: steps.ids.outputs.ids != '' && steps.pages.outcome == 'failure'
        id: pages2
        continue-on-error: true

      - name: Esperar mais um pouco
        if: steps.ids.outputs.ids != '' && steps.pages.outcome == 'failure' && steps.pages2.outcome == 'failure'
        run: sleep 90

      - uses: actions/deploy-pages@v4
        if: steps.ids.outputs.ids != '' && steps.pages.outcome == 'failure' && steps.pages2.outcome == 'failure'
        id: pages3

      - name: Publicar no Instagram
        if: steps.ids.outputs.ids != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ steps.pages.outputs.page_url || steps.pages2.outputs.page_url || steps.pages3.outputs.page_url }}
        run: |
          MEDIA_BASE_URL="${MEDIA_BASE_URL%/}"
          for id in ${{ steps.ids.outputs.ids }}; do
            # o CDN do Pages leva alguns segundos para servir o arquivo novo
            f=$(ls out/$id | sort | head -1)
            for i in $(seq 30); do curl -sfI "$MEDIA_BASE_URL/$id/$f" >/dev/null && break; sleep 5; done
            node publish.mjs "$id" ${{ inputs.check && '--check' || '' }}
          done

      # Mesmo post na Página do Facebook. Só roda com o secret FB_PAGE_TOKEN (token da Página); falha aqui não afeta o Instagram.
      - name: Publicar no Facebook
        if: steps.ids.outputs.ids != '' && !inputs.check
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MEDIA_BASE_URL: ${{ steps.pages.outputs.page_url || steps.pages2.outputs.page_url || steps.pages3.outputs.page_url }}
        run: |
          for id in ${{ steps.ids.outputs.ids }}; do node publish-facebook.mjs "$id" || echo "Facebook falhou em $id"; done

      - name: Salvar registro
        if: always() && steps.ids.outputs.ids != ''
        run: |
          git config user.name "vg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json 2>/dev/null || true; git add facebook.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publicado: ${{ steps.ids.outputs.ids }}" && git push)

      # Locução do próximo reel, feita com antecedência e guardada no repositório (assets/voz/ID): o plano grátis do
      # Gemini só dá 10 falas por dia, então o dia do reel não pode depender da cota.
      - name: Preparar a locução do próximo reel
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || exit 0
          node locucao.mjs --precisa || exit 0
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node locucao.mjs --proximo
          git config user.name "vg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voz
          git diff --cached --quiet && exit 0
          git commit -m "Locução guardada do próximo reel"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
